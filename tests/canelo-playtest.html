<!doctype html><html lang="es"><meta charset="utf-8"><title>Canelo · revisión</title>
<link rel="stylesheet" href="/src/styles.css">
<style>body{display:block;overflow:auto}#game{width:min(960px,100vw)}#game canvas{max-width:100%;height:auto}#results{white-space:pre-wrap;font:14px monospace;padding:8px}button{padding:8px;margin:4px}</style>
<button id="dialogue">Ver diálogo</button><button id="play">Ver minijuego</button><button id="check">Comprobar flujo</button>
<div id="results">Cargando…</div><div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script type="module">
import { ASSETS } from '/src/config/assets.js';
import { GameScene } from '/src/scenes/GameScene.js';
import { HeartCatchScene } from '/src/scenes/HeartCatchScene.js';
import { CANELO } from '/src/config/canelo.js';
const out=document.querySelector('#results');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.addEventListener('error',e=>out.textContent+='\nERROR '+e.message);
window.addEventListener('unhandledrejection',e=>out.textContent+='\nERROR '+e.reason);
class Check extends GameScene {
  preload(){for(const a of Object.values(ASSETS))a.type==='spritesheet'?this.load.spritesheet(a.key,a.url,{frameWidth:a.frameWidth,frameHeight:a.frameHeight}):this.load.image(a.key,a.url);}
  create(){
    super.create(); this.player.body.reset(CANELO.position.x,CANELO.position.y+65);
    this.cameras.main.stopFollow();this.cameras.main.centerOn(480,710);
    out.textContent='Listo. Canelo está en la isla inferior izquierda.';
    document.querySelector('#dialogue').onclick=()=>this.openCaneloDialogue();
    document.querySelector('#play').onclick=()=>this.openHeartCatch();
    document.querySelector('#check').onclick=()=>this.checkFlow();
  }
  async checkFlow(){
    const button=document.querySelector('#check');button.disabled=true;
    const record=(ok,label)=>{out.textContent+='\n'+(ok?'PASS ':'FAIL ')+label;if(!ok)throw Error(label);};
    try {
      if(this.scene.isActive('heart-catch')){this.scene.get('heart-catch').leave();await wait(150);}
      out.textContent='Revisión';
      const position={x:this.player.x,y:this.player.y};
      this.openCaneloDialogue();record(this.dialoguePurpose==='canelo-intro','Canelo abre su introducción');
      let n=0;while(this.dialogue.isOpen&&n++<60){this.dialogue.finishReveal();this.dialogue.next();}
      await wait(5900);
      const game=this.scene.get('heart-catch');
      record(this.scene.isPaused()&&game.stage==='playing','Mapa pausado; introducción y cuenta atrás completas');
      game.spawnAt=Infinity;game.clearItems();
      const oldX=game.player.x;game.keys.D.isDown=true;game.update(0,50);game.keys.D.isDown=false;
      record(game.player.x>oldX,'Movimiento horizontal activo');
      const collect=type=>{game.spawn(type,0,game.player.x);game.items.at(-1).sprite.y=game.player.y-19;game.update(0,16);};
      collect('heart');collect('heart');collect('heart');collect('banana');
      record(game.round.hearts===3&&game.round.combo===1&&game.round.slowUntil===0,'Banano solo rompe combo');
      collect('rock');record(game.round.slowUntil>game.time.now,'Piedra ralentiza');
      for(let i=0;i<27;i++)collect('heart');
      record(game.round.hearts===30&&game.round.phase==='key'&&game.items.length===1,'30 corazones detienen objetos y aparece llave');
      game.items[0].sprite.y=500;game.update(0,16);
      record(game.items.length===1&&game.items[0].sprite.y<100,'Llave perdida vuelve a caer');
      game.items[0].sprite.y=game.player.y-19;game.items[0].sprite.x=game.player.x;game.update(0,16);
      record(game.stage==='won'&&this.state.keyFragments.includes('canelo'),'Atrapar llave guarda premio');
      const count=this.state.keyFragments.length;this.completeCaneloGame();
      record(this.state.keyFragments.length===count,'Premio no se duplica');
      await wait(800);game.leave();await wait(150);
      record(this.scene.isActive()&&this.player.x===position.x&&this.player.y===position.y,'Vuelve al mismo punto del mapa');
      this.openHeartCatch();await wait(100);
      record(!this.scene.isActive('heart-catch'),'Prueba completada no vuelve a abrirse');
      this.openCaneloDialogue();record(this.dialoguePurpose==='canelo-repeat'&&this.dialogue.flow.lines.length===1,'Una frase por encuentro después de ganar');
    }catch(e){out.textContent+='\nERROR '+e.message;}finally{button.disabled=false;}
  }
}
new Phaser.Game({type:Phaser.AUTO,width:960,height:540,parent:'game',render:{pixelArt:true,antialias:false},physics:{default:'arcade'},scene:[Check,HeartCatchScene]});
</script></html>
